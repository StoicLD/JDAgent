[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jdagent"
version = "0.1.0"
description = "A model-independent agent runtime built for learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
]

[project.scripts]
jdagent = "jdagent.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jdagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires explicit opt-in and a real provider credential",
]
